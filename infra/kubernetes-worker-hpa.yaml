apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: s3-media-transcoder-workers
  namespace: production-apps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: s3-media-transcoder-workers
  minReplicas: 2
  maxReplicas: 24
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: s3-media-transcoder-workers
  namespace: production-apps
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: s3-media-transcoder-workers }
