apiVersion: apps/v1
kind: Deployment
metadata:
  name: shogun-kuber-x-app
  namespace: shogun-system
  labels:
    app: shogun-kuber-x
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shogun-kuber-x
  template:
    metadata:
      labels:
        app: shogun-kuber-x
    spec:
      serviceAccountName: shogun-workload-sa
      containers:
      - name: shogun-app
        image: 891923193192.dkr.ecr.ap-south-1.amazonaws.com/shogun-kuber-x/worker:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: AWS_REGION
          value: "ap-south-1"
        - name: S3_BUCKET_NAME
          value: "shogun-kuber-x-storage-891923193192-ap-south-1"
---
apiVersion: v1
kind: Service
metadata:
  name: shogun-kuber-x-service
  namespace: shogun-system
spec:
  type: LoadBalancer
  selector:
    app: shogun-kuber-x
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000