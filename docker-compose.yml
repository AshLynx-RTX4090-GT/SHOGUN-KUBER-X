services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shogun_kuber_x
      POSTGRES_USER: shogun
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shogun -d shogun_kuber_x"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: replace-with-a-long-random-secret
      DATABASE_URL: postgresql://shogun:change-me@postgres:5432/shogun_kuber_x
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
