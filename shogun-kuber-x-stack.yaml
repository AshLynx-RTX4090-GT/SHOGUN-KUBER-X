AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation Stack for SHOGUN KUBER X: VPC, EKS Cluster, Managed Node Group, S3, and IAM Policies.'

Parameters:
  ProjectName:
    Type: String
    Default: 'shogun-kuber-x'
    Description: 'Project name prefix for resources'

  ClusterVersion:
    Type: String
    Default: '1.30'
    Description: 'Kubernetes version for Amazon EKS'

  NodeInstanceType:
    Type: String
    Default: 't3.medium'
    Description: 'EC2 instance type for worker nodes'

  NodeMinSize:
    Type: Number
    Default: 1
    Description: 'Minimum number of worker nodes'

  NodeDesiredSize:
    Type: Number
    Default: 2
    Description: 'Desired number of worker nodes'

  NodeMaxSize:
    Type: Number
    Default: 4
    Description: 'Maximum number of worker nodes'

Resources:
  # =========================================================================
  # 1. NETWORKING (VPC, Subnets, Internet Gateway)
  # =========================================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-igw'

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-rt'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-subnet-1'
        - Key: !Sub 'kubernetes.io/cluster/${ProjectName}-cluster'
          Value: 'shared'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-subnet-2'
        - Key: !Sub 'kubernetes.io/cluster/${ProjectName}-cluster'
          Value: 'shared'

  Subnet1RouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref RouteTable

  Subnet2RouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref RouteTable

  # =========================================================================
  # 2. S3 STORAGE & PIPELINE POLICY
  # =========================================================================
  PipelineS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-storage-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  ShogunKuberXS3AccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: ShogunKuberXS3AccessPolicy
      Description: 'Allows SHOGUN KUBER X workloads to read, write, and manage S3 objects'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 's3:PutObject'
              - 's3:GetObject'
              - 's3:ListBucket'
              - 's3:DeleteObject'
            Resource:
              - !GetAtt PipelineS3Bucket.Arn
              - !Sub '${PipelineS3Bucket.Arn}/*'

  # =========================================================================
  # 3. IAM ROLES (EKS Control Plane & EC2 Nodes)
  # =========================================================================
  EKSControlPlaneRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-controlplane-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: 'eks.amazonaws.com'
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonEKSClusterPolicy'

  EKSNodeInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-node-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: 'ec2.amazonaws.com'
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy'
        - 'arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly'
        - 'arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy'
        - !Ref ShogunKuberXS3AccessPolicy

  # =========================================================================
  # 4. SECURITY GROUPS
  # =========================================================================
  EKSControlPlaneSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Cluster communication with worker nodes'
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-cluster-sg'

  # =========================================================================
  # 5. EKS CLUSTER CONTROL PLANE
  # =========================================================================
  EKSCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Sub '${ProjectName}-cluster'
      Version: !Ref ClusterVersion
      RoleArn: !GetAtt EKSControlPlaneRole.Arn
      ResourcesVpcConfig:
        SecurityGroupIds:
          - !Ref EKSControlPlaneSG
        SubnetIds:
          - !Ref PublicSubnet1
          - !Ref PublicSubnet2
        EndpointPublicAccess: true
        EndpointPrivateAccess: true
      Logging:
        ClusterLogging:
          EnabledTypes:
            - Type: api
            - Type: audit
            - Type: authenticator

  # =========================================================================
  # 6. EKS MANAGED NODE GROUP
  # =========================================================================
  EKSNodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: EKSCluster
    Properties:
      ClusterName: !Ref EKSCluster
      NodegroupName: !Sub '${ProjectName}-nodegroup'
      NodeRole: !GetAtt EKSNodeInstanceRole.Arn
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      InstanceTypes:
        - !Ref NodeInstanceType
      ScalingConfig:
        MinSize: !Ref NodeMinSize
        DesiredSize: !Ref NodeDesiredSize
        MaxSize: !Ref NodeMaxSize
      AmiType: AL2023_x86_64_STANDARD
      CapacityType: ON_DEMAND

Outputs:
  ClusterName:
    Description: 'EKS Cluster Name'
    Value: !Ref EKSCluster

  ClusterEndpoint:
    Description: 'EKS Control Plane API Endpoint'
    Value: !GetAtt EKSCluster.Endpoint

  S3BucketName:
    Description: 'Pipeline Artifact S3 Bucket Name'
    Value: !Ref PipelineS3Bucket

  S3PolicyArn:
    Description: 'Managed IAM Policy ARN for S3 Access'
    Value: !Ref ShogunKuberXS3AccessPolicy

  NodeRoleArn:
    Description: 'IAM Role used by worker nodes'
    Value: !GetAtt EKSNodeInstanceRole.Arn